<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Downloads</title><link rel="stylesheet" href="ui.css">
<style>body{width:320px}.wrap{padding:12px}.j{border-top:1px solid var(--line);padding:9px 0}
.j:first-child{border-top:0}.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:5px 0}
.bar i{display:block;height:100%;background:var(--accent)}.top{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.j button{padding:3px 9px;font-size:12.5px}</style></head>
<body><div class="wrap">
  <div class="top"><strong>Downloads</strong><button id="settings">Settings</button></div>
  <div id="jobs"></div>
</div><script src="popup.js"></script></body></html>
